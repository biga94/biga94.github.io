# Site settings
title: Davide Biganzoli
description: >-
  Personal site — bio, contact links, and occasional notes.
url: "https://biga94.github.io"
baseurl: ""

theme: minima

# Stringa semplice, non un oggetto: la versione di Minima che gira su
# GitHub Pages non lo destruttura e lo stamperebbe come hash grezzo
# ({"name"=>"..."}) nel footer.
author: Davide Biganzoli

markdown: kramdown
permalink: /:year/:month/:day/:title/

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-scholar

# Config per jekyll-scholar (pagina pubblicazioni).
# last_name/first_name: usati per evidenziare il tuo nome in grassetto
# nella lista autori di ogni paper, invece di perderlo in mezzo agli "others".
scholar:
  last_name: Biganzoli
  first_name: [Davide, D.]
  style: apa
  source: ./_bibliography
  bibliography: references.bib
  bibliography_template: "{{reference}}"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
